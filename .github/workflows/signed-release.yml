name: Build signed release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      release_title:
        description: 'Release Title (optional, defaults to Release Tag)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-signed-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.1.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || (echo "Missing SIGNING_KEYSTORE_BASE64 repository secret." && exit 1)
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sentinel-release.keystore"

      - name: Assemble signed production APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD" || (echo "Missing SIGNING_STORE_PASSWORD repository secret." && exit 1)
          test -n "$SIGNING_KEY_ALIAS" || (echo "Missing SIGNING_KEY_ALIAS repository secret." && exit 1)
          test -n "$SIGNING_KEY_PASSWORD" || (echo "Missing SIGNING_KEY_PASSWORD repository secret." && exit 1)
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/sentinel-release.keystore" \
            -PRELEASE_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk SentinelShield.apk
          cp SentinelShield.apk "SentinelShield-${{ steps.release_info.outputs.tag }}.apk"

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ inputs.release_title != '' && inputs.release_title || steps.release_info.outputs.tag }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            SentinelShield.apk
            SentinelShield-${{ steps.release_info.outputs.tag }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelShield-APK
          path: SentinelShield.apk
          if-no-files-found: error
          retention-days: 30
