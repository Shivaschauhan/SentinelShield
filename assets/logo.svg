<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
    <defs>
        <linearGradient id="gradBase" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F2027"/>
            <stop offset="50%" stop-color="#203A43"/>
            <stop offset="100%" stop-color="#2C5364"/>
        </linearGradient>
        <linearGradient id="gradShield" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4facfe"/>
            <stop offset="100%" stop-color="#00f2fe"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <rect width="120" height="120" rx="30" fill="url(#gradBase)" />
    <!-- Shield Background -->
    <path d="M60 20 L95 35 V60 C95 85 75 105 60 110 C45 105 25 85 25 60 V35 Z" fill="rgba(255,255,255,0.1)" stroke="url(#gradShield)" stroke-width="2"/>
    <!-- Inner Shield / S logo -->
    <path d="M60 30 L85 42 V62 C85 80 70 95 60 100 C50 95 35 80 35 62 V42 Z" fill="url(#gradShield)" filter="url(#glow)"/>
    <path d="M67.5 50 C57.5 50 47.5 50 47.5 60 C47.5 70 72.5 70 72.5 80 C72.5 90 57.5 90 47.5 90 M47.5 50 L57.5 50" stroke="#0F2027" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
